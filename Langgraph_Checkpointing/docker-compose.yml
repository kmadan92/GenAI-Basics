services:
  ollama:
    image: ollama/ollama
    container_name: ollama-mistral
    ports:
      - "11435:11434"  # Ollama API exposed here
    volumes:
      - ollama-data:/root/.ollama  # Persist model cache/data
    restart: unless-stopped

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db

volumes:
  ollama-data:
  mongodb_data:
